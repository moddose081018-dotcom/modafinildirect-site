name: Build and deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or commit to build
        required: false
        default: main
      deploy_production:
        description: Promote the tested artifact to production
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.revision.outputs.commit_sha }}
      deploy_enabled: ${{ steps.gate.outputs.deploy_enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Record the exact revision
        id: revision
        shell: bash
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Reads the deploy gate once, normalised (case and whitespace), and says
      # exactly what it found. A skipped deploy job gives no reason; this does.
      # Only presence is reported for the secret, never its value.
      - name: Evaluate the deploy gate
        id: gate
        shell: bash
        env:
          DEPLOY_FLAG: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          flag="$(printf '%s' "$DEPLOY_FLAG" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          case "$flag" in true|1|yes|on) enabled=true ;; *) enabled=false ;; esac
          {
            echo "## Deploy gate"
            echo
            echo "| setting | state |"
            echo "|---|---|"
            echo "| vars.CLOUDFLARE_DEPLOY_ENABLED | ${DEPLOY_FLAG:-(unset)} -> deploy_enabled=$enabled |"
            echo "| vars.CLOUDFLARE_ACCOUNT_ID | $([ -n "$ACCOUNT_ID" ] && echo set || echo '(unset)') |"
            echo "| secrets.CLOUDFLARE_API_TOKEN | $([ "$HAS_TOKEN" = true ] && echo set || echo '(unset)') |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$enabled" = true ]; then
            [ -n "$ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_DEPLOY_ENABLED is on but the CLOUDFLARE_ACCOUNT_ID repository variable is unset"; exit 1; }
            [ "$HAS_TOKEN" = true ] || { echo "::error::CLOUDFLARE_DEPLOY_ENABLED is on but the CLOUDFLARE_API_TOKEN repository secret is unset"; exit 1; }
          else
            echo "::warning::Deploy gate is off (CLOUDFLARE_DEPLOY_ENABLED='${DEPLOY_FLAG}'). Build only; nothing will be deployed. Set the repository variable to true."
          fi
          echo "deploy_enabled=$enabled" >> "$GITHUB_OUTPUT"

      # `npm run check` builds, validates the artifact and ends with the
      # deterministic preflight gate. Both deploy jobs depend on this job, so
      # a violation means nothing reaches staging or production.
      - name: Test, build and gate the public artifact
        env:
          SITE_COMMIT_SHA: ${{ steps.revision.outputs.commit_sha }}
        run: |
          npm test
          npm run check
          node tools/build-public-site.js --check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: modafinildirect-public-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  # Both deploy jobs are gated on the CLOUDFLARE_DEPLOY_ENABLED repository
  # variable. Until it is "true", a green run is a green BUILD, not a
  # deployment. See DEPLOYMENT.md.
  deploy-staging:
    if: needs.build.outputs.deploy_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://modafinildirect-staging.pages.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.commit_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: modafinildirect-public-${{ github.run_id }}
          path: dist
      - name: Deploy exact artifact to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ needs.build.outputs.commit_sha }}
        run: >-
          npx wrangler pages deploy dist
          --project-name modafinildirect-staging
          --branch main
          --commit-hash "$COMMIT_SHA"
          --commit-message "GitHub Actions staging deployment"
      - name: Smoke test staging
        run: node tools/smoke-test.js https://modafinildirect-staging.pages.dev preview "${{ needs.build.outputs.commit_sha }}"

  deploy-production:
    if: needs.build.outputs.deploy_enabled == 'true' && (github.event_name == 'push' || inputs.deploy_production)
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://modafinildirect.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.commit_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: modafinildirect-public-${{ github.run_id }}
          path: dist
      - name: Deploy the tested artifact to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ needs.build.outputs.commit_sha }}
        run: >-
          npx wrangler pages deploy dist
          --project-name modafinildirect-prod
          --branch main
          --commit-hash "$COMMIT_SHA"
          --commit-message "GitHub Actions production deployment"
      - name: Smoke test production
        run: node tools/smoke-test.js https://modafinildirect.com production "${{ needs.build.outputs.commit_sha }}"
